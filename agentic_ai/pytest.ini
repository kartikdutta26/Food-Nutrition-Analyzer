[pytest]
testpaths = tests
pythonpath = ..
addopts = -p no:cacheprovider
markers =
    integration: actual local Ollama inference, enabled with NUTRIAI_RUN_LIVE_TESTS=1
    usda_live: explicit opt-in to live external USDA API requests
    nutrition_integration: actual Qwen3-to-nutrition workflow with offline USDA records
