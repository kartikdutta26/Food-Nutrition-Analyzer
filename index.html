<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Understand what's on your plate and build a nutrition routine that feels like yours with NutriAI." />
    <title>NutriAI — Your food, your goals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="font-sans antialiased overflow-x-hidden min-h-screen">
    <script>
      (function() {
        try {
          const saved = localStorage.getItem('nutriai-theme');
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          const nextTheme = saved === 'light' || saved === 'dark' ? saved : (prefersDark ? 'dark' : 'light');
          document.documentElement.dataset.theme = nextTheme;
          document.documentElement.style.colorScheme = nextTheme;
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
